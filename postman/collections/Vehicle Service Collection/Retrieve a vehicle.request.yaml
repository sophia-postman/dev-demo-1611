$kind: http-request
url: "{{baseUrl}}/vehicles/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "1"
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer"
          }
        },
        "required": [
          "value"
        ]
      }
settings: {}
examples: ./.resources/Retrieve a vehicle.resources/examples
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const statusCode = pm.response.code;

      if (statusCode === 200) {
        pm.test("Status code is 200", () => {
          pm.response.to.have.status(200);
        });

        pm.test("Response has Content-Type: application/json", () => {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
        });

        pm.test("Response body is an object", () => {
          const body = pm.response.json();
          pm.expect(body).to.be.an("object");
        });

        pm.test("Response contains required fields", () => {
          const body = pm.response.json();
          pm.expect(body).to.have.all.keys("id", "nickName", "vin", "make", "model", "year", "miles");
        });

        pm.test("'id' is an integer", () => {
          const body = pm.response.json();
          pm.expect(body.id).to.be.a("number");
          pm.expect(Number.isInteger(body.id)).to.be.true;
        });

        pm.test("'nickName' is a string", () => {
          const body = pm.response.json();
          pm.expect(body.nickName).to.be.a("string");
        });

        pm.test("'vin' is a string", () => {
          const body = pm.response.json();
          pm.expect(body.vin).to.be.a("string");
        });

        pm.test("'make' is a string", () => {
          const body = pm.response.json();
          pm.expect(body.make).to.be.a("string");
        });

        pm.test("'model' is a string", () => {
          const body = pm.response.json();
          pm.expect(body.model).to.be.a("string");
        });

        pm.test("'year' is a string", () => {
          const body = pm.response.json();
          pm.expect(body.year).to.be.a("string");
        });

        pm.test("'miles' is a number", () => {
          const body = pm.response.json();
          pm.expect(body.miles).to.be.a("number");
        });

      } else if (statusCode === 404) {
        pm.test("Status code is 404", () => {
          pm.response.to.have.status(404);
        });

        pm.test("Response has Content-Type: application/json", () => {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
        });

        pm.test("404 response contains 'message' field", () => {
          const body = pm.response.json();
          pm.expect(body).to.have.property("message");
          pm.expect(body.message).to.be.a("string");
        });

      } else {
        pm.test(`Unexpected status code: ${statusCode}`, () => {
          pm.expect([200, 404]).to.include(statusCode);
        });
      }
order: 2000
